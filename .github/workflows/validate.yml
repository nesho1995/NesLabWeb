name: Validar NESLAB

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/apps/web/package-lock.json

      - name: Restaurar y probar backend
        run: dotnet test tests/backend/unit/NesLab.Web.Tests/NesLab.Web.Tests.csproj --configuration Release

      - name: Instalar frontend
        working-directory: src/frontend/apps/web
        run: npm ci

      - name: Auditar dependencias frontend
        working-directory: src/frontend/apps/web
        run: npm audit --audit-level=high

      - name: Compilar frontend
        working-directory: src/frontend/apps/web
        run: npm run build

